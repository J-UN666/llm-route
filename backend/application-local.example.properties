# Copy to application-local.properties. Replace placeholders with your own values if needed.
amap.web-service-key=${AMAP_WEB_SERVICE_KEY:}
assistant.llm.base-url=${LLM_BASE_URL:}
assistant.llm.api-key=${LLM_API_KEY:}
assistant.llm.model=${LLM_MODEL:}

# Persistent chat requires a MySQL schema with Flyway V2 applied. Place, form and single-turn queries work without it.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/llmroute?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# For phone debugging, use 0.0.0.0 and this computer's LAN IP in the frontend.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
