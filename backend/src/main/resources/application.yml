spring:
  application:
    name: llm-route-backend
  config:
    import: optional:file:./backend/application-local.properties

  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/llmroute?connectionTimeZone=UTC&characterEncoding=UTF-8}"
    username: "${DB_USER:}"
    password: "${DB_PASSWORD:}"
    hikari:
      pool-name: llm-route-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      initialization-fail-timeout: -1

  flyway:
    enabled: false

campus:
  data-root: ${CAMPUS_DATA_ROOT:.}
  application-places: classpath:data/application-places.json
  application-connectors: classpath:data/campus-connectors.json

amap:
  web-service-key: "${AMAP_WEB_SERVICE_KEY:}"
  transit-base-url: "${AMAP_TRANSIT_BASE_URL:https://restapi.amap.com/v3/direction/transit/integrated}"
  connect-timeout-millis: ${AMAP_CONNECT_TIMEOUT_MILLIS:3000}
  read-timeout-millis: ${AMAP_READ_TIMEOUT_MILLIS:10000}

assistant:
  tool-check:
    enabled: ${ASSISTANT_TOOL_CHECK_ENABLED:true}
  llm:
    base-url: "${LLM_BASE_URL:}"
    api-key: "${LLM_API_KEY:}"
    model: "${LLM_MODEL:}"
    connect-timeout-millis: ${LLM_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${LLM_READ_TIMEOUT_MILLIS:30000}
    max-tool-rounds: ${LLM_MAX_TOOL_ROUNDS:3}

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        journeys:
          include: readinessState,campus,transitConfiguration
        chat:
          include: readinessState,campus,transitConfiguration,modelConfiguration,conversationSchema
