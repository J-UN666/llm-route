# Include in the nginx http context. Replace api.example.com and set a trusted TLS chain.
limit_req_zone $binary_remote_addr zone=zhixing_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=zhixing_client:10m;

map $uri $zhixing_route {
    default other;
    /api/journeys journeys;
    ~^/api/service-config service-config;
    ~^/api/assistant/ assistant;
    ~^/api/places places;
    ~^/api/campus/ campus;
    ~^/actuator/health/ health;
}

log_format zhixing_status '$request_id $request_method $zhixing_route $status $upstream_status $request_time';

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/zhixing_access.log zhixing_status;
    client_max_body_size 16k;

    location = /api/assistant/tool-check {
        return 404;
    }

    location /api/ {
        limit_req zone=zhixing_api burst=15 nodelay;
        limit_conn zhixing_client 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ ^/actuator/health/(liveness|journeys|chat)$ {
        limit_req zone=zhixing_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location /web/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
