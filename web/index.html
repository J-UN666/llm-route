<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交大智行</title>
  <link rel="stylesheet" href="css/planner.css">
  <script defer src="data/campus.js"></script>
  <script defer src="js/map.js"></script>
  <script defer src="js/route-map.js"></script>
  <script defer src="js/planner.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">交</span>
        <div><h1>交大智行</h1><p>犀浦校区 · 成都出行</p></div>
      </div>
      <div class="service-actions">
        <span id="service-summary" class="service-summary"></span>
        <button id="open-settings" class="button header-button" type="button">服务设置</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="panel controls" aria-label="出行查询">
      <div class="segmented mode" aria-label="查询方式">
        <button type="button" data-mode="form" aria-pressed="true">规划路线</button>
        <button type="button" data-mode="chat" aria-pressed="false">自然语言问路</button>
      </div>

      <form id="route-form">
        <fieldset id="form-fields">
          <div class="field location">
            <label for="origin">校园起点</label>
            <input id="origin" type="search" placeholder="如图书馆、天佑斋 1 号楼"
                   maxlength="80" autocomplete="off" aria-describedby="origin-feedback" required>
            <p id="origin-feedback" class="field-feedback" role="status"></p>
            <ul id="origin-results" class="places" hidden></ul>
          </div>
          <div class="field location">
            <label for="destination">城市终点</label>
            <input id="destination" type="search" placeholder="如成都博物馆、小河街 1 号"
                   maxlength="80" autocomplete="off" aria-describedby="destination-feedback" required>
            <p id="destination-feedback" class="field-feedback" role="status"></p>
            <ul id="destination-results" class="places" hidden></ul>
          </div>
          <div class="field">
            <label for="departure">出发时间 <span class="unemphasized">北京时间</span></label>
            <div class="date-row">
              <input id="departure" type="datetime-local" required>
              <button id="departure-now" class="button secondary" type="button">现在</button>
            </div>
          </div>
          <div class="field">
            <label for="exit-gate">出校校门</label>
            <select id="exit-gate" aria-describedby="gate-feedback">
              <option value="">自动选择最快校门</option>
            </select>
            <p id="gate-feedback" class="field-feedback" role="status"></p>
          </div>
          <button id="plan-button" class="button primary full" type="submit">查询路线</button>
        </fieldset>
      </form>

      <section id="chat-panel" hidden aria-label="自然语言问路">
        <div class="chat-heading">
          <h2>问路对话</h2>
          <button id="new-chat" class="button text-button" type="button">新会话</button>
        </div>
        <div id="messages" class="messages" role="log" aria-live="polite"></div>
        <div id="clarifications" class="choices"></div>
        <form id="chat-form">
          <label class="visually-hidden" for="message">问路内容</label>
          <textarea id="message" rows="3" maxlength="500"
                    placeholder="从天佑斋到成都博物馆，少走路" required></textarea>
          <button id="chat-send" class="button primary full" type="submit">发送</button>
        </form>
        <button id="chat-retry" class="button secondary full" type="button" hidden>重试上次请求</button>
      </section>
      <p id="query-status" class="field-feedback query-status" role="status"></p>
    </section>

    <section class="results" aria-label="路线结果">
      <div id="route-options" class="panel route-options" hidden>
        <div class="card-heading"><h2>路线方案</h2><span id="provider" class="unemphasized"></span></div>
        <div id="plan-list" class="plan-list"></div>
        <ul id="route-warnings" class="warnings" hidden></ul>
      </div>

      <section class="panel map-card" aria-labelledby="map-heading">
        <div class="card-heading map-heading">
          <h2 id="map-heading">路线地图</h2>
          <div class="map-tools" aria-label="地图操作">
            <button type="button" id="zoom-in" aria-label="放大地图">＋</button>
            <button type="button" id="zoom-out" aria-label="缩小地图">−</button>
            <button type="button" id="fit-map">复位</button>
          </div>
        </div>
        <div id="map-sections" class="segmented map-sections" aria-label="地图范围" hidden>
          <button type="button" data-section="campus" aria-pressed="true">校内到校门</button>
          <button type="button" data-section="city" aria-pressed="false">校门到目的地</button>
          <button type="button" data-section="all" aria-pressed="false">全程</button>
        </div>
        <div id="route-map" class="map-viewport" aria-label="可拖动缩放的路线地图"></div>
        <footer class="map-footer">
          <span id="map-status" role="status"></span>
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 贡献者</a>
        </footer>
      </section>

      <section id="itinerary" class="panel itinerary" hidden aria-labelledby="itinerary-heading">
        <div class="card-heading"><h2 id="itinerary-heading">行程分段</h2></div>
        <div id="route-steps"></div>
      </section>
    </section>
  </main>

  <dialog id="settings" aria-labelledby="settings-heading">
    <header class="dialog-header">
      <h2 id="settings-heading">服务设置</h2>
      <form method="dialog"><button class="button text-button" type="submit">关闭</button></form>
    </header>
    <div class="dialog-body">
      <p id="settings-mode" class="unemphasized"></p>
      <form id="amap-config" class="key-form">
        <label for="amap-key">高德 Web 服务 Key</label>
        <input id="amap-key" type="password" placeholder="输入高德 Web 服务 Key"
               required autocomplete="off" spellcheck="false" maxlength="32">
        <div class="key-actions">
          <p id="amap-status" class="field-feedback"></p>
          <button class="button primary" type="submit">验证</button>
          <button id="remove-amap" class="button text-button" type="button" hidden>撤销</button>
        </div>
      </form>
      <form id="model-config" class="key-form">
        <label for="model">模型</label>
        <select id="model" required></select>
        <label for="model-key">DeepSeek API Key</label>
        <input id="model-key" type="password" placeholder="输入 DeepSeek API Key"
               required autocomplete="off" spellcheck="false" maxlength="160">
        <div class="key-actions">
          <p id="model-status" class="field-feedback"></p>
          <button class="button primary" type="submit">验证</button>
          <button id="remove-model" class="button text-button" type="button" hidden>撤销</button>
        </div>
      </form>
      <p id="config-feedback" class="field-feedback" role="status"></p>
      <button id="use-default" class="button secondary full" type="button" hidden>使用默认服务并撤销个人配置</button>
    </div>
  </dialog>
</body>
</html>
